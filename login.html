<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise | Login</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.8rem;
        }

        .header p {
            color: var(--secondary-color);
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .toggle-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .toggle-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* Simple animation for switching modes */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <h1 id="form-title">SpendWise</h1>
            <p id="form-subtitle">Track every penny, live better.</p>
        </div>

        <form id="auth-form">
            <div class="form-group" id="name-group" style="display: none;">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">Sign In</button>
        </form>

        <div class="toggle-text">
            <span id="toggle-msg">Don't have an account?</span>
            <a href="#" id="toggle-link">Sign Up</a>
        </div>
    </div>

    <script>
        const authForm = document.getElementById('auth-form');
        const toggleLink = document.getElementById('toggle-link');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const nameGroup = document.getElementById('name-group');
        const toggleMsg = document.getElementById('toggle-msg');

        let isLogin = true;

        // Toggle between Login and Sign Up
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLogin = !isLogin;

            if (isLogin) {
                formTitle.innerText = "SpendWise";
                submitBtn.innerText = "Sign In";
                toggleMsg.innerText = "Don't have an account?";
                toggleLink.innerText = "Sign Up";
                nameGroup.style.display = "none";
            } else {
                formTitle.innerText = "Create Account";
                submitBtn.innerText = "Get Started";
                toggleMsg.innerText = "Already have an account?";
                toggleLink.innerText = "Log In";
                nameGroup.style.display = "block";
            }
        });

        // Form Submission Logic
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // In a real app, you'd send this data to your backend API
            console.log(`Attempting ${isLogin ? 'Login' : 'Signup'} with:`, { email, password });

            // Mock success
            alert(`${isLogin ? 'Logged in' : 'Registered'} successfully! Redirecting to dashboard...`);
            
            // Example redirect:
            // window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
